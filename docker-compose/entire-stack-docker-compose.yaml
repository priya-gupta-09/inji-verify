version: '3.7'

services:
  inji-verify-ui:
    container_name: inji-verify-ui
    image: kiruthikavjshankar/inji-verify-ui:mosip-connect
#    image: inji-verify-ui:local
#    pull_policy: never
    ports:
      - "3002:80"
    environment:
      - INTERNET_CONNECTIVITY_CHECK_ENDPOINT=${INTERNET_CONNECTIVITY_CHECK_ENDPOINT-https://dns.google/}
      - INTERNET_CONNECTIVITY_CHECK_TIMEOUT=${INTERNET_CONNECTIVITY_CHECK_TIMEOUT-10000}
      - OVP_QR_HEADER={OVP_QR_HEADER-INJI_OVP://payload=}
      - VERIFY_SERVICE_API_URL=https://ccc0-122-161-21-147.ngrok-free.app
      - DEFAULT_TITLE=Inji Verify
      - DEFAULT_THEME=default_theme
      - DEFAULT_LANG=en
      - DEFAULT_FONT_URL=https://fonts.googleapis.com/css?family=Inter
      - OVP_QR_HEADER=INJI_OVP://
      - DEFAULT_FAVICON=favicon.ico
      - VERIFIABLE_CLAIMS_CONFIG_URL=/assets/config.json
      - VP_REQUEST_STATUS_LONGPOLL_TIMEOUT=60000
#    platform: linux/amd64
    platform: linux/arm64/v8

  inji-verify-be:
    container_name: inji-verify-backend
    image:  kiruthikavjshankar/inji-verify-backend:mosip-connect
    ports:
      - "8080:8080"
    platform: linux/arm64/v8

# composable FE
  composable-banking-frontend:
    container_name: composable-banking-frontend
    image: kiruthikavjshankar/composable-banking-client:mosip-connect
    ports:
      - "3000:80"
    networks:
      - react
    platform: linux/arm64/v8
    depends_on:
      - composable-banking-mock-server
      - consent-manager-be
      - composable-banking-be
    environment:
      - name=Ravinder Mahajan
#      composable server backend
      - SERVER_URL=http://host.docker.internal:8082
      - CONSENT_MANAGER_URL=http://host.docker.internal:4444
#
  composable-banking-mock-server:
    container_name: composable-banking-mockserver
    image: kiruthikavjshankar/composable-banking-mock-server:mosip-connect
    ports:
      - "7001:5001"
    networks:
      - react
    platform: linux/arm64/v8

##  composable banking backend
  composable-banking-be-postgres:
    image: postgres
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cb-user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: onboarding-microservice
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "cb-user" ]
      interval: 10s
      retries: 5
      start_period: 5s
    platform: linux/arm64/v8

  composable-banking-be-mountebank:
    image: bbyars/mountebank:2.8.1
    container_name: composable-banking-be-mountebank
    restart: unless-stopped
    command: start
    ports:
      - "2525:2525"
      - "4545:4545"
    platform: linux/arm64/v8

  composable-banking-be:
    image: kiruthikavjshankar/composable-banking-be:mosip-connect
    container_name: composable-banking-be
    ports:
      - "8082:8080"
    platform: linux/arm64/v8
    environment:
      - DB_USER=cb-user
      - DB_PASSWORD=pass
      - DB_NAME=onboarding-microservice
      - DB_HOST=postgres
    depends_on:
      - composable-banking-be-postgres
#  composable banking integration layer

  composable-banking-il:
    image: kiruthikavjshankar/composable-banking-il:mosip-connect
    container_name: composable-banking-il
    ports:
      - "8081:8080"
    environment:
      - SPRING_CONFIG_LOCATION=/config/application.properties  # Set properties file path
    volumes:
        - ./config/il-application.properties:/config/application.properties
    platform: linux/arm64/v8

##mobility sample
  mobility-sample-fe:
    container_name: mobility-sample-frontend
    image: kiruthikavjshankar/mobility-sample-fe:mosip-connect
    ports:
      - "3001:3000"
    platform: linux/arm64/v8

  mobility-sample-bap:
    container_name: mobility-sample-bap
    image: kiruthikavjshankar/mobility-sample-bap:mosip-connect
    ports:
      - "2010:2010"
    platform: linux/arm64/v8

#This failing - Error: invalid input
  mobility-sample-bpp:
    container_name: mobility-sample-bpp
    image: kiruthikavjshankar/mobility-sample-bpp:mosip-connect
    ports:
      - "3010:3010"
    env_file:
      - ./config/.env
    platform: linux/arm64/v8
#    pull_policy: never
    depends_on:
      - sample-gateway-registry

  sample-gateway-registry:
    container_name: sample-gateway-registry
    image: kiruthikavjshankar/sample-gateway-registry:mosip-connect
    ports:
      - "1010:1010"
    platform: linux/arm64/v8
    depends_on:
      - mobility-sample-bap

## consent manager
  consent-manager-be:
    container_name: consent-manager-be
    image: kiruthikavjshankar/consent-manager-be:mosip-connect
    ports:
      - "4444:4444"
    platform: linux/arm64/v8

  consent-manager-fe:
    container_name: consent-manager-fe
    image: kiruthikavjshankar/consent-manager-fe:mosip-connect
    pull_policy: missing
    ports:
      - "3003:3000"
    platform: linux/arm64/v8
networks:
  react:
    driver: bridge

volumes:
  pg_data: